name: Build Unsigned IPA

on:
  workflow_dispatch:  # ← HANYA manual, gak auto
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Make script executable
        run: chmod +x ./build_unsigned.sh
      
      - name: Build
        run: ./build_unsigned.sh
