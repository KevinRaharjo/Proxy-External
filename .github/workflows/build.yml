name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x ./build_unsigned.sh ./build_esign_ready_ipa.sh

      - name: Build
        run: ./build_unsigned.sh

      - name: Verify eSign-ready
        run: ./build_esign_ready_ipa.sh build/External-Nixx.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: External-Nixx-ipa
          path: build/External-Nixx.ipa
          retention-days: 30
