name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: List root directory
        run: ls -la
      - name: Make script executable
        run: chmod +x build_unsigned.sh
      - name: Build IPA
        run: ./build_unsigned.sh
      - name: List build directory (debug)
        run: ls -la build/
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          # Coba cari semua kemungkinan nama file IPA
          path: |
            build/*.ipa
            build/External-Noelx-unsigned.ipa
            build/ExternalNoelx-unsigned.ipa
